<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Clavier d'or</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <div class="centerSpace">
            <div class="ScoreQuestion">
                <p>Score thème : <span id="ScoreTheme"></span> / 100</p>
            </div>
            <h1 class="TitreConnexion">Clavier d'or </h1>
            <button class="button" id="btn_menu">Retour au menu</button>
        </div>
    </header>
    <div class="center">
        <h2 id="TitreTheme"></h2>
    </div>        
    
    <div class="center">
        <div class="CardQuestion">
            <p class="question"> Question <span id="TypeQuestion"></span> : <span id="Libelle"> </span></p>
            <p id="Indice"></p>
        </div>
    </div>
    
    <div class="reponses">
        <button class="btn_reponse" id="ReponseA"></button>
        <button class="btn_reponse" id="ReponseB"></button>
        <button class="btn_reponse" id="ReponseC"></button>
        <button class="btn_reponse" id="ReponseD"></button>
    </div>
    
    <div class="center">
        <button class="button" id="QuestionSuivante" style="display: none;"> Question suivante</button>
    </div>
    <footer>
        <button id="btn_indice">Indice</button>
    </footer>
    
    <script src="/js/question.js" defer></script>
    
</body>

</html>
